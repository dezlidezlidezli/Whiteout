<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Frostkettle</title>
    <meta name="description" content="A cosy camp game: keep the kettle warm, thaw the Icebound and relight the valley." />
    <meta name="application-name" content="Frostkettle" />
    <meta name="apple-mobile-web-app-title" content="Frostkettle" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e1626" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- iOS launch images (portrait), generated by scripts/make-icons.cjs -->
    <link rel="apple-touch-startup-image" href="/splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/splash/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <style>
      /* Platform contract: safe areas and app height as CSS variables for all game UI. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --app-height: 100vh;
        --fk-night: #0e1626;
        --fk-cream: #f6e7cf;
        --fk-ember: #ffb35c;
        color-scheme: dark;
      }
      @supports (height: 100dvh) { :root { --app-height: 100dvh; } }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; overscroll-behavior: none;
        background: var(--fk-night); color: var(--fk-cream);
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      body {
        position: fixed; inset: 0; height: var(--app-height);
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      * { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      input, textarea, [contenteditable='true'] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
      img { -webkit-user-drag: none; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #ui { position: absolute; inset: 0; pointer-events: none; }

      /* Loading splash: visible from the first paint until the game dispatches `fk-ready`. */
      #fk-splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--fk-night);
        transition: opacity 0.45s ease, visibility 0s linear 0.45s;
      }
      #fk-splash.fk-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #fk-splash .fk-logo {
        position: relative; width: 34vmin; height: 34vmin; max-width: 170px; max-height: 170px;
        border-radius: 23%;
        animation: fk-bob 2.4s ease-in-out infinite;
      }
      #fk-splash .fk-logo img { width: 100%; height: 100%; border-radius: 23%; display: block; }
      #fk-splash .fk-logo::after {
        content: ''; position: absolute; inset: -30%; z-index: -1; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 160, 70, 0.32), rgba(255, 160, 70, 0));
        animation: fk-glow 2.4s ease-in-out infinite;
      }
      #fk-splash .fk-title {
        margin-top: 6.8vmin; font-weight: 800; letter-spacing: 0.04em;
        font-size: min(7.5vmin, 38px); text-shadow: 0 2px 12px rgba(255, 150, 60, 0.35);
      }
      #fk-splash .fk-dots { margin-top: 18px; display: flex; gap: 9px; }
      #fk-splash .fk-dots i {
        width: 8px; height: 8px; border-radius: 50%; background: var(--fk-ember); opacity: 0.25;
        animation: fk-dot 1.2s ease-in-out infinite;
      }
      #fk-splash .fk-dots i:nth-child(2) { animation-delay: 0.2s; }
      #fk-splash .fk-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes fk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes fk-glow { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @keyframes fk-dot { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @media (prefers-reduced-motion: reduce) {
        #fk-splash .fk-logo, #fk-splash .fk-logo::after, #fk-splash .fk-dots i { animation: none; }
      }

      /* "Turn your phone upright" hint for phones held sideways. */
      #fk-rotate {
        position: fixed; inset: 0; z-index: 1100; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: rgba(14, 22, 38, 0.96); text-align: center;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
      #fk-rotate .fk-phone {
        width: 40px; height: 68px; border: 4px solid var(--fk-cream); border-radius: 10px; position: relative;
        animation: fk-turn 2.2s ease-in-out infinite;
      }
      #fk-rotate .fk-phone::after {
        content: ''; position: absolute; left: 50%; bottom: 5px; width: 10px; height: 3px; margin-left: -5px;
        border-radius: 2px; background: var(--fk-cream);
      }
      #fk-rotate p { margin: 0; font-size: 17px; font-weight: 700; }
      #fk-rotate small { opacity: 0.7; font-size: 13px; }
      @keyframes fk-turn { 0%, 20% { transform: rotate(-90deg); } 55%, 100% { transform: rotate(0deg); } }
      @media (orientation: landscape) and (max-height: 540px) and (pointer: coarse) {
        #fk-rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="fk-splash" role="status" aria-label="Loading Frostkettle">
      <div class="fk-logo"><img src="/icons/icon.svg" alt="" width="170" height="170" /></div>
      <div class="fk-title">Frostkettle</div>
      <div class="fk-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div id="fk-rotate" aria-live="polite">
      <div class="fk-phone" aria-hidden="true"></div>
      <p>Turn your phone upright</p>
      <small>Frostkettle is played in portrait</small>
    </div>
    <script>
      // Splash removal: the game dispatches `window.dispatchEvent(new Event('fk-ready'))` once the
      // first frame is drawn. A timeout fallback guarantees the splash can never get stuck.
      (function () {
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var s = document.getElementById('fk-splash');
          if (!s) return;
          s.classList.add('fk-hide');
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 600);
        }
        window.addEventListener('fk-ready', hide);
        setTimeout(hide, 15000);
        window.__fkHideSplash = hide;
      })();
    </script>
    <script type="module" src="/src/platform/pwa.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
